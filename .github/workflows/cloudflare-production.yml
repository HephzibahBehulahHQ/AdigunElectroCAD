name: Publish verified Cloudflare runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electrocad-cloudflare-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stamp the verified build
        run: node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("dist/release.json", JSON.stringify({sourceCommit:process.env.GITHUB_SHA}));'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-worker-assets
          path: dist
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://adigunelectrocad.hephzibahbehulah.com/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-worker-assets
          path: dist
      - name: Publish the verified account Worker and editor
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer main revision superseded this release."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret in the cloudflare-production environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in the cloudflare-production environment."
            exit 1
          fi
          npm exec --yes --package=wrangler@4.158.0 -- wrangler deploy --config wrangler.toml --env production --keep-vars
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify live release identity and account routing
        if: steps.deploy.outputs.published == 'true'
        run: node scripts/verify-live-worker.mjs "$GITHUB_SHA"
