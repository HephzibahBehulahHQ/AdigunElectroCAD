name = "adigunelectrocad-account-preview"
main = "cloudflare/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[vars]
SUPABASE_URL = "https://fqcbfnktdvqojyezxeis.supabase.co"

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "61"
simple = { limit = 10, period = 60 }

[env.production]
name = "adigunelectrocad-account-preview"
workers_dev = false
preview_urls = false
routes = [{ pattern = "adigunelectrocad.hephzibahbehulah.com/*", zone_name = "hephzibahbehulah.com" }]

[env.production.assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/account"]

[env.production.vars]
SUPABASE_URL = "https://fqcbfnktdvqojyezxeis.supabase.co"

[[env.production.ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "62"
simple = { limit = 10, period = 60 }
